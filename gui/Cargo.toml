[package]
name = "goodbyedpi-control"
version = "0.1.0"
edition = "2021"
description = "A friendly Windows control center for GoodbyeDPI"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
eframe = "0.29"
directories = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
url = "2"
winreg = "0.52"

[build-dependencies]
winres = "0.1"

[package.metadata.bundle]
name = "GoodbyeDPI Control"
identifier = "com.goodbyedpi.control"

